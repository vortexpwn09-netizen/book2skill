version: "3.9"

services:
  web:
    build: .
    container_name: book2skill-web
    ports:
      - "8000:8000"
    environment:
      APP_PORT: 8000
      CORS_ORIGINS: "*"
      BOOK2SKILL_DB_PATH: /data/book2skill.db
      BOOK2SKILL_FREE_TRIAL_DAYS: ${BOOK2SKILL_FREE_TRIAL_DAYS:-7}
      BOOK2SKILL_IP_TRIAL_COOLDOWN_DAYS: ${BOOK2SKILL_IP_TRIAL_COOLDOWN_DAYS:-365}
      BOOK2SKILL_IP_HASH_SECRET: ${BOOK2SKILL_IP_HASH_SECRET:-}
      BOOK2SKILL_COOKIE_SECURE: ${BOOK2SKILL_COOKIE_SECURE:-false}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PREMIUM_PRICE_LABEL: ${PREMIUM_PRICE_LABEL:-Premium subscription}
    restart: unless-stopped
    volumes:
      - book2skill-data:/data

volumes:
  book2skill-data:
