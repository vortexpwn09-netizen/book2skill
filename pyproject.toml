[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "book2skill"
version = "0.1.0"
description = "Knowledge compiler for turning documents into AI-ready skill packages"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pypdf>=4.0.0",
  "python-docx>=1.1.0",
  "fastapi>=0.111.0",
  "python-multipart>=0.0.9",
  "stripe>=12.0.0",
  "python-dotenv>=1.0.0",
  "uvicorn>=0.30.0",
  "httpx>=0.27.0",
]

[project.scripts]
book2skill = "book2skill.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
